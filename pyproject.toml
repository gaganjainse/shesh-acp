[project]
name = "shesha-acp"
version = "0.1.0"
description = "Shesha Soma/Mind: Agent Client Protocol (ACP) server for editors (Zed/JetBrains)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Gagan Jain" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
shesha-acp = "shesha_acp.__main__:main"

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B", "SIM", "I"]
ignore = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
