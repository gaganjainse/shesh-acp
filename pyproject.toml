[project]
name = "shesh-acp"
version = "0.1.0"
description = "Shesh Soma/Mind: Agent Client Protocol (ACP) server for editors (Zed/JetBrains)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Gagan Jain" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
shesh-acp = "shesh_acp.__main__:main"

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# BLE+TRY are errors, not style: blind `except Exception` is where silent
# failures live. See shesh-ecosystem/docs (2026-08-12 silent-failure sweep).
extend-select = ["BLE", "TRY"]
select = ["E", "F", "W", "UP", "B", "SIM", "I"]
ignore = ["E402"]

[tool.pytest.ini_options]

pythonpath = ["src"]
testpaths = ["tests"]
